name: release

# Runs only by hand (Actions tab → release → Run workflow). By default it only checks: it takes
# the six platform packages that CI built for the chosen commit, validates them and verifies that
# both publishing tokens can publish as gigi-didberidze. It publishes only when "publish" is ticked.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the VS Code Marketplace and Open VSX (unticked: check only)"
        type: boolean
        default: false
      platforms:
        description: "Platforms to publish, space-separated (empty: all six)"
        type: string
        default: ""
      ci_run:
        description: "Take the packages from this CI run ID (empty: the run for this commit)"
        type: string
        default: ""
      stores:
        description: "Where to publish"
        type: choice
        options: [both, marketplace, openvsx]
        default: both

permissions:
  contents: read
  actions: read

jobs:
  release:
    name: ${{ inputs.publish && 'publish' || 'check' }}
    runs-on: ubuntu-latest
    env:
      PUBLISHER: gigi-didberidze
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci

      - name: Find the CI run that built this commit
        id: ci
        env: { GH_TOKEN: "${{ github.token }}", CI_RUN: "${{ inputs.ci_run }}" }
        run: |
          if [ -n "$CI_RUN" ]; then
            # A named run must be a successful CI run (to complete a release from the same builds).
            ok=$(gh run view "$CI_RUN" --json workflowName,conclusion -q 'select(.workflowName == "ci" and .conclusion == "success") | "yes"')
            [ "$ok" = yes ] || { echo "::error::run $CI_RUN is not a successful ci run"; exit 1; }
            echo "run=$CI_RUN" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$run" ]; then
            echo "::error::No successful CI run for $GITHUB_SHA. Release only commits whose CI passed."
            exit 1
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Download the six platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: vsix
          merge-multiple: true
          run-id: ${{ steps.ci.outputs.run }}
          github-token: ${{ github.token }}

      - name: Check the packages
        run: |
          ls -la vsix
          count=$(ls vsix/*.vsix | wc -l)
          if [ "$count" -ne 6 ]; then echo "::error::expected 6 packages, found $count"; exit 1; fi
          version=$(node -p "require('./extension/package.json').version")
          for f in vsix/*.vsix; do
            # Each package must carry the right ID, version and an indexer binary for its platform.
            unzip -p "$f" extension.vsixmanifest | grep -q "Id=\"terrain\"" || { echo "::error::$f: wrong ID"; exit 1; }
            unzip -p "$f" extension.vsixmanifest | grep -q "Version=\"$version\"" || { echo "::error::$f: not version $version"; exit 1; }
            unzip -l "$f" | grep -q "extension/bin/terrain-indexer" || { echo "::error::$f: no indexer binary"; exit 1; }
            echo "ok: $f (version $version)"
          done

      - name: Verify the Marketplace token
        env: { VSCE_PAT: "${{ secrets.VSCE_PAT }}" }
        run: npx vsce verify-pat "$PUBLISHER"

      - name: Verify the Open VSX token
        env: { OVSX_PAT: "${{ secrets.OVSX_PAT }}" }
        run: |
          if out=$(npx ovsx verify-pat "$PUBLISHER" 2>&1); then
            echo "$out"
          elif echo "$out" | grep -qi "not found"; then
            # The namespace is created on the first publish; until then only the token's format can be checked.
            echo "$out"
            echo "::notice::Open VSX namespace $PUBLISHER does not exist yet; it is created on the first publish."
          else
            echo "$out"; exit 1
          fi

      - name: Choose the packages to publish
        if: ${{ inputs.publish }}
        env: { PLATFORMS: "${{ inputs.platforms }}" }
        run: |
          mkdir -p publish
          for f in vsix/*.vsix; do
            p=$(basename "$f" .vsix); p=${p#terrain-}
            if [ -z "$PLATFORMS" ] || [[ " $PLATFORMS " == *" $p "* ]]; then cp "$f" publish/; fi
          done
          ls publish
          [ -n "$(ls publish)" ] || { echo "::error::no package matches: $PLATFORMS"; exit 1; }

      # One upload at a time, and wait between them: a brand-new extension's first upload is
      # still being verified when the next arrives, and the Marketplace dropped five of six
      # uploads sent back to back on the first release.
      - name: Publish to the VS Code Marketplace
        if: ${{ inputs.publish && inputs.stores != 'openvsx' }}
        env: { VSCE_PAT: "${{ secrets.VSCE_PAT }}" }
        run: |
          for f in publish/*.vsix; do
            npx vsce publish --packagePath "$f"
            sleep 60
          done

      - name: Publish to Open VSX
        if: ${{ inputs.publish && inputs.stores != 'marketplace' }}
        env: { OVSX_PAT: "${{ secrets.OVSX_PAT }}" }
        run: |
          npx ovsx verify-pat "$PUBLISHER" >/dev/null 2>&1 || npx ovsx create-namespace "$PUBLISHER"
          for f in publish/*.vsix; do npx ovsx publish "$f"; done
