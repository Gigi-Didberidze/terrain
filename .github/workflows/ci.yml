name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  checks:
    name: lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: indexer }
      - run: npm ci
      - run: npm run gen:check
      - run: npm run readme:check
      - run: npm run typecheck
      - run: npm test
      - run: cargo fmt --manifest-path indexer/Cargo.toml --all --check
      - run: cargo clippy --manifest-path indexer/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path indexer/Cargo.toml --workspace

  # One job per host OS: builds the native target (tested) and a cross target (built only).
  # Six platforms on three runners; see DECISIONS.md D6.
  build:
    name: build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            native: { target: x86_64-unknown-linux-gnu, vsce: linux-x64 }
            cross: { target: aarch64-unknown-linux-gnu, vsce: linux-arm64 }
          - os: windows-latest
            native: { target: x86_64-pc-windows-msvc, vsce: win32-x64 }
            cross: { target: aarch64-pc-windows-msvc, vsce: win32-arm64 }
          - os: macos-latest
            native: { target: aarch64-apple-darwin, vsce: darwin-arm64 }
            cross: { target: x86_64-apple-darwin, vsce: darwin-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.native.target }},${{ matrix.cross.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: indexer, key: "${{ matrix.os }}" }
      - name: Install aarch64 cross toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV
      - name: Build indexer (native and cross)
        run: |
          cargo build --release --manifest-path indexer/Cargo.toml -p terrain-indexer --target ${{ matrix.native.target }}
          cargo build --release --manifest-path indexer/Cargo.toml -p terrain-indexer --target ${{ matrix.cross.target }}
      - name: Test indexer (native)
        run: cargo test --release --manifest-path indexer/Cargo.toml --workspace --target ${{ matrix.native.target }}
      - run: npm ci
      - run: npm run build
      - name: Stage native binary
        shell: bash
        run: |
          ext=""; [[ "${{ runner.os }}" == "Windows" ]] && ext=".exe"
          mkdir -p extension/bin
          cp "indexer/target/${{ matrix.native.target }}/release/terrain-indexer$ext" extension/bin/
          chmod +x extension/bin/terrain-indexer* || true
      - name: Integration test (opens the map in a real VS Code)
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then xvfb-run -a npm run test:integration -w extension; else npm run test:integration -w extension; fi
      - name: Package VSIX (native and cross)
        shell: bash
        working-directory: extension
        run: |
          ext=""; [[ "${{ runner.os }}" == "Windows" ]] && ext=".exe"
          npx vsce package --no-dependencies --target ${{ matrix.native.vsce }} -o terrain-${{ matrix.native.vsce }}.vsix
          rm -f bin/terrain-indexer*
          cp "../indexer/target/${{ matrix.cross.target }}/release/terrain-indexer$ext" bin/
          npx vsce package --no-dependencies --target ${{ matrix.cross.vsce }} -o terrain-${{ matrix.cross.vsce }}.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.os }}
          path: extension/*.vsix
          if-no-files-found: error
      - name: Upload native indexer for benchmarks
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: indexer-linux-x64
          path: indexer/target/x86_64-unknown-linux-gnu/release/terrain-indexer

  bench:
    name: benchmarks (hard gate from M2)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/download-artifact@v4
        with: { name: indexer-linux-x64, path: bin }
      - run: chmod +x bin/terrain-indexer
      - run: node bench/run.mjs --hard --binary bin/terrain-indexer
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/results/latest.json

  visual:
    name: visual tests in three themes
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/download-artifact@v4
        with: { name: indexer-linux-x64, path: bin }
      - run: chmod +x bin/terrain-indexer
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Contrast, rendering and state screens in dark, light and high contrast
        run: node webview/test-visual/themes.mjs . visual-out --binary bin/terrain-indexer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-screenshots
          path: visual-out
